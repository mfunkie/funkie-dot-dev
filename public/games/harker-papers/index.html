<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Harker Papers | funkie.dev</title>
<meta name="description" content="A seven-chapter point-and-click adventure through Bram Stoker's Dracula, told through the journals of the people who wrote it down.">
<meta property="og:title" content="The Harker Papers">
<meta property="og:description" content="A point-and-click adventure through Bram Stoker's Dracula.">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Special+Elite&display=swap">
<style>
/* Layout: a lantern-lit stage on top, the journal page (dialogue + pockets) beneath it; one committed night palette. */
:root {
  --night: #0c0e15;      /* page ground */
  --ink: #151925;        /* panels */
  --rule: #2a3040;       /* hairlines */
  --bone: #e9dfc9;       /* text */
  --mist: #8d93a3;       /* muted text */
  --candle: #e3a84f;     /* accent: lamplight */
  --blood: #a3242b;      /* danger / the Count */
  --paper: #ddd0b3;      /* typed documents */
  --paper-ink: #22201b;
  --f-display: "IM Fell English SC", "IM Fell English", Georgia, "Times New Roman", serif;
  --f-body: "IM Fell English", Georgia, "Times New Roman", serif;
  --f-type: "Special Elite", "Courier New", Courier, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
.home { font-family: var(--f-type); font-size: 12px; letter-spacing: .06em; color: var(--mist); text-decoration: none; }
.home:hover { color: var(--candle); }
body { background: var(--night); color: var(--bone); font-family: var(--f-body); font-size: 17px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; box-sizing: border-box; }
#app { max-width: 980px; margin: 0 auto; display: grid; gap: 10px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--candle); outline-offset: 2px; }

.bar { display: flex; align-items: center; gap: 12px; justify-content: space-between; flex-wrap: wrap; }
.where { min-width: 0; }
#doc { font-family: var(--f-type); font-size: 12px; letter-spacing: .04em; color: var(--candle); display: block; }
#place { font-family: var(--f-display); font-size: 22px; line-height: 1.1; text-wrap: balance; }
.tools { display: flex; gap: 6px; }
.tool { background: transparent; border: 1px solid var(--rule); border-radius: 3px; padding: 5px 10px; font-family: var(--f-type); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--mist); }
.tool:hover, .tool[aria-pressed="true"] { color: var(--candle); border-color: var(--candle); }

#stage { position: relative; aspect-ratio: 8 / 5; max-width: 100%; max-height: 64vh; margin: 0 auto; width: min(100%, calc(64vh * 1.6));
  border: 1px solid var(--rule); overflow: hidden; background: #05060a; box-shadow: 0 20px 60px -30px #000; }
#art { width: 100%; height: 100%; display: block; }
#spots { position: absolute; inset: 0; }
.spot { position: absolute; background: transparent; border: 1px dashed transparent; border-radius: 4px; padding: 0; transition: border-color .15s, background .15s; }
.spot.round { border-radius: 50%; }
.spot:hover, .spot:focus-visible, #spots.reveal .spot { border-color: color-mix(in srgb, var(--candle) 70%, transparent); background: color-mix(in srgb, var(--candle) 8%, transparent); }
.spot .tag { position: absolute; left: 50%; bottom: calc(100% + 4px); transform: translateX(-50%); white-space: nowrap; font-family: var(--f-type); font-size: 11px; padding: 2px 6px; background: color-mix(in srgb, var(--night) 88%, transparent); color: var(--candle); border-radius: 2px; opacity: 0; pointer-events: none; transition: opacity .15s; }
.spot:hover .tag, .spot:focus-visible .tag, #spots.reveal .spot .tag { opacity: 1; }
#hud { position: absolute; top: 8px; right: 8px; font-family: var(--f-type); font-size: 12px; background: color-mix(in srgb, var(--night) 80%, transparent); padding: 6px 10px; border: 1px solid var(--rule); color: var(--bone); pointer-events: none; }

.controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.verb { background: var(--ink); border: 1px solid var(--rule); border-radius: 3px; padding: 6px 14px; font-family: var(--f-display); font-size: 16px; }
.verb[aria-pressed="true"] { border-color: var(--candle); color: var(--candle); }
#status { font-family: var(--f-type); font-size: 13px; color: var(--mist); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

#box { position: relative; background: var(--ink); border: 1px solid var(--rule); border-left: 3px solid var(--rule); padding: 14px 18px 16px; min-height: 5.6em; cursor: default; }
#box.spoken { border-left-color: var(--candle); }
#box.waiting { cursor: pointer; }
#box.waiting::after { content: "▾"; position: absolute; right: 12px; bottom: 6px; color: var(--candle); animation: bob 1.2s ease-in-out infinite; }
#box.fresh .line { animation: rise .35s ease-out; }
.line { max-width: 68ch; }
.who { display: block; font-family: var(--f-display); color: var(--candle); font-size: 15px; letter-spacing: .03em; }
.speech { font-size: 18px; }
.narr { font-style: italic; color: var(--bone); }

.pockets { display: grid; gap: 6px; }
.pockets h2 { margin: 0; font-family: var(--f-type); font-weight: normal; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--mist); }
#inv { display: flex; gap: 8px; flex-wrap: wrap; min-height: 54px; }
#inv .empty { margin: 0; color: var(--mist); font-style: italic; align-self: center; }
.item { display: flex; align-items: center; gap: 6px; background: var(--ink); border: 1px solid var(--rule); border-radius: 3px; padding: 5px 10px 5px 6px; font-size: 15px; }
.item svg { width: 34px; height: 34px; flex: none; }
.item.sel { border-color: var(--candle); box-shadow: 0 0 0 1px var(--candle) inset; color: var(--candle); }
.item.flash { animation: glow 1.1s ease-out; }

.overlay { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; overflow-y: auto;
  padding: max(20px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(20px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: radial-gradient(ellipse at 50% 30%, #1b1f2e 0%, var(--night) 70%); }
.overlay.card { background: color-mix(in srgb, var(--night) 92%, transparent); }
.title-wrap { max-width: 34rem; width: 100%; display: grid; gap: 14px; justify-items: start; }
.eyebrow { margin: 0; font-family: var(--f-type); font-size: 12px; letter-spacing: .08em; color: var(--candle); }
.game-title { margin: 0; font-family: var(--f-display); font-weight: normal; font-size: clamp(52px, 13vw, 96px); line-height: .9; letter-spacing: -.01em; color: var(--bone); }
.game-title::first-line { color: var(--bone); }
.sub { margin: 0; font-size: 19px; color: var(--mist); max-width: 30rem; }
.menu { display: grid; gap: 8px; width: 100%; max-width: 20rem; margin-top: 8px; }
.btn { text-align: left; background: var(--ink); border: 1px solid var(--rule); border-radius: 3px; padding: 10px 16px; font-family: var(--f-display); font-size: 18px; }
.btn:hover:not(:disabled) { border-color: var(--candle); color: var(--candle); }
.btn.ghost { background: transparent; }
.btn.ink { background: var(--paper-ink); color: var(--paper); border-color: var(--paper-ink); margin-top: 8px; }
.btn.ink:hover { color: var(--candle); }
.list-head { margin: 0; font-family: var(--f-display); font-weight: normal; font-size: 34px; }
.chlist { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; width: 100%; }
.chlist .btn { width: 100%; display: flex; gap: 12px; align-items: center; }
.chlist .cn { font-family: var(--f-type); color: var(--candle); width: 1.2em; font-variant-numeric: tabular-nums; }
.chlist small { display: block; font-family: var(--f-type); font-size: 11px; color: var(--mist); }
.chlist .locked { opacity: .4; cursor: not-allowed; }
.how ul { margin: 0; padding-left: 1.1em; display: grid; gap: 8px; font-size: 17px; }

.paper { background: var(--paper); color: var(--paper-ink); max-width: 36rem; width: 100%; padding: 28px clamp(18px, 5vw, 40px) 30px; box-shadow: 0 30px 80px -20px #000;
  background-image: repeating-linear-gradient(transparent 0 27px, color-mix(in srgb, var(--paper-ink) 7%, transparent) 27px 28px); }
.folio { margin: 0 0 10px; font-family: var(--f-type); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; opacity: .6; }
.doc-head { margin: 0; font-family: var(--f-type); font-weight: normal; font-size: 20px; min-height: 1.4em; }
.doc-date { margin: 2px 0 14px; font-family: var(--f-type); font-size: 13px; opacity: .7; }
.ch-title { margin: 0 0 10px; font-family: var(--f-display); font-weight: normal; font-size: 30px; color: var(--blood); line-height: 1.05; text-wrap: balance; }
.intro { margin: 0 0 10px; font-size: 18px; max-width: 60ch; }
.sign { font-style: italic; text-align: right; margin: 6px 0 0; }

@keyframes bob { 50% { transform: translateY(3px); } }
@keyframes rise { from { opacity: .2; transform: translateY(4px); } }
@keyframes glow { 0% { box-shadow: 0 0 0 2px var(--candle), 0 0 18px var(--candle); } 100% { box-shadow: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (max-width: 560px) { #place { font-size: 19px; } .speech { font-size: 17px; } .tool { padding: 5px 8px; } }
</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <div class="where"><span id="doc"></span><span id="place">The Harker Papers</span></div>
    <div class="tools">
      <a class="home tool" href="/">funkie.dev</a>
      <button class="tool" id="reveal" aria-pressed="false">Reveal</button>
      <button class="tool" id="hint">Hint</button>
      <button class="tool" id="menu">Menu</button>
    </div>
  </header>
  <div id="stage">
    <svg id="art" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Scene"></svg>
    <div id="spots"></div>
    <div id="hud" hidden></div>
  </div>
  <div class="controls">
    <button class="verb" data-verb="act" aria-pressed="true">Act</button>
    <button class="verb" data-verb="look" aria-pressed="false">Look</button>
    <span id="status" aria-live="polite"></span>
  </div>
  <div id="box" aria-live="polite"><div class="line"></div></div>
  <section class="pockets"><h2>Carried</h2><div id="inv"></div></section>
</div>
<div id="overlay" class="overlay" hidden></div>

<script src="engine.js"></script>
<script src="art.js"></script>
<script src="ch1.js"></script>
<script src="ch2.js"></script>
<script src="ch3.js"></script>
<script src="ch4.js"></script>
<script src="ch5.js"></script>
<script src="ch6.js"></script>
<script src="ch7.js"></script>
<script>G.boot();</script>
</body>
</html>

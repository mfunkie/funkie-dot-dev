<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Dr Jekyll and Mr Hyde | funkie.dev</title>
<meta name="description" content="Strange Case of Dr Jekyll and Mr Hyde as a turn-based game of being seen and not seen, drawn like a ZX Spectrum game: people come over to Jekyll and back away from Hyde.">
<meta property="og:title" content="JEKYLL.EXE: Strange Case of Dr Jekyll and Mr Hyde">
<meta property="og:description" content="Stevenson's novel as a ZX Spectrum game of two natures in one body.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/favicon.ico">
<link rel="preload" href="/fonts/funkie-dos.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face {
  font-family: 'Funkie DOS';
  src: url('/fonts/funkie-dos.woff2') format('woff2');
  font-display: swap;
}
:root { color-scheme: dark; --gray: #7c7c7c; --light: #d7d7d7; --green: #00ff00; --red: #d70000; }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: #000; color: var(--light);
  font-family: 'Funkie DOS', 'Courier New', monospace; font-size: 16px; line-height: 16px;
  -webkit-font-smoothing: none; overflow: hidden;
  touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
#app {
  height: 100%;
  display: grid; grid-template-rows: minmax(0, 1fr) auto;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
#tv { position: relative; min-height: 0; display: grid; place-items: center; overflow: hidden; }
#screen { display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; }

/* Desktop: a line of keys under the picture. */
#legend {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 0 20px;
  padding: 8px 16px 12px; color: var(--gray); white-space: nowrap;
}
#legend b { color: var(--green); font-weight: normal; }
#legend a, #legend button { font: inherit; color: var(--gray); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: none; }
#legend a:hover, #legend button:hover, #legend a:focus-visible, #legend button:focus-visible { color: var(--green); outline: none; }
#legend button[aria-pressed="true"] { text-decoration: line-through; }
body.embed #home { display: none; }
@media (max-height: 520px) { #legend { display: none; } }

/* Touch: a D-pad and buttons for the rest, sized to the phone. */
#pad { display: none; --u: min(52px, 12vw); --b: min(58px, 14vw); }
body.touch #legend { display: none; }
body.touch #pad {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px max(12px, 4vw) 18px; gap: 8px; max-width: 100vw; overflow: hidden;
}
.dpad { position: relative; width: calc(var(--u) * 3); height: calc(var(--u) * 3); flex: none; }
.dpad [data-k] { position: absolute; width: var(--u); height: var(--u); background: #3c3c3c; border-radius: 6px; }
.dpad [data-k].on { background: #7c7c7c; }
.dpad .u { left: var(--u); top: 0; } .dpad .d { left: var(--u); bottom: 0; }
.dpad .l { left: 0; top: var(--u); } .dpad .r { right: 0; top: var(--u); }
.dpad .hub { position: absolute; left: var(--u); top: var(--u); width: var(--u); height: var(--u); background: #3c3c3c; border-radius: 0; }
.dpad .u::after, .dpad .d::after, .dpad .l::after, .dpad .r::after {
  content: ''; position: absolute; left: 50%; top: 50%; width: 0; height: 0;
  border: 8px solid transparent; transform: translate(-50%, -50%);
}
.dpad .u::after { border-bottom-color: #000; margin-top: -4px; }
.dpad .d::after { border-top-color: #000; margin-top: 4px; }
.dpad .l::after { border-right-color: #000; margin-left: -4px; }
.dpad .r::after { border-left-color: #000; margin-left: 4px; }
.keys { display: grid; grid-template-columns: repeat(3, var(--b)); gap: 8px; flex: none; }
.keys [data-k] {
  height: var(--b); border-radius: 8px; background: #3c3c3c; color: #d7d7d7;
  display: grid; place-items: center; font-size: 16px; text-align: center; line-height: 16px;
}
.keys [data-k].on { background: #7c7c7c; color: #000; }
.keys .x { background: #d70000; color: #fff; }
.keys .w { background: #0000d7; color: #fff; }
/* Phones held sideways: picture in the middle, controls at the sides. */
@media (orientation: landscape) {
  #pad { --u: min(48px, 13vh); --b: min(50px, 14vh); }
  body.touch #app { grid-template-rows: 1fr; }
  body.touch #pad { position: absolute; inset: 0; pointer-events: none; padding: 16px max(16px, env(safe-area-inset-left, 0px)); max-width: none; }
  body.touch #pad > * { pointer-events: auto; }
  body.touch .dpad [data-k], body.touch .dpad .hub { opacity: .55; }
  body.touch .keys [data-k] { opacity: .7; }
}
</style>
</head>
<body>
<div id="app">
  <div id="tv"><canvas id="screen" width="320" height="240" aria-label="Strange Case of Dr Jekyll and Mr Hyde, a turn-based game"></canvas></div>
  <div id="legend">
    <span><b>&larr;&uarr;&darr;&rarr;</b> walk</span>
    <span><b>Space</b> wait</span>
    <span><b>X</b> drink</span>
    <span><b>Z</b> undo</span>
    <span><b>R</b> start over</span>
    <span><b>L</b> look</span>
    <span><b>H</b> hint</span>
    <span><b>Enter</b> menu</span>
    <button id="mute" aria-pressed="false" title="Sound (M)"><b>M</b> sound</button>
    <a id="home" href="/games">funkie.dev</a>
  </div>
  <div id="pad" aria-hidden="true">
    <div class="dpad">
      <div class="hub"></div>
      <div data-k="n" class="u"></div><div data-k="s" class="d"></div>
      <div data-k="w" class="l"></div><div data-k="e" class="r"></div>
    </div>
    <div class="keys">
      <div data-k="look">LOOK</div><div data-k="hint">HINT</div><div data-k="esc">MENU</div>
      <div data-k="undo">UNDO</div><div data-k="wait" class="w">WAIT</div><div data-k="drink" class="x">DRINK</div>
    </div>
  </div>
</div>
<script src="core.js"></script>
<script src="world.js"></script>
<script src="rooms.js"></script>
<script src="screen.js"></script>
<script src="font.js"></script>
<script src="art.js"></script>
<script src="render.js"></script>
<script src="pictures.js"></script>
<script src="story.js"></script>
<script src="audio.js"></script>
<script src="game.js"></script>
<script>JH.boot();</script>
</body>
</html>
